name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test
      # Scoped to the TS sources kept prettier-clean; docs, JSON metadata, and
      # packages/ui predate the check and are not formatted yet.
      - run: bunx prettier --check src tests coport/src
      - run: bun run typecheck
      - run: bun run --cwd coport typecheck
