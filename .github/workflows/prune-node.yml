# `workflow_call` only — see the note in build-one.yml. Called by build.yml,
# check-upstream.yml and rebuild-changed.yml.
name: "[internal] Prune build node"

on:
  workflow_call:

jobs:
  prune:
    runs-on: ubuntu-latest
    concurrency:
      group: cofoundry-prune
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PVE_TOKEN_SECRET: ${{ secrets.PVE_TOKEN_SECRET }}
      PVE_HOST: ${{ vars.PVE_HOST || secrets.PVE_HOST }}
      SSH_TARGET: ${{ vars.SSH_TARGET || secrets.SSH_TARGET }}
      PVE_NODE: ${{ vars.PVE_NODE || secrets.PVE_NODE }}
      PVE_TOKEN_ID: ${{ vars.PVE_TOKEN_ID || secrets.PVE_TOKEN_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAG || 'tag:ci' }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking=no" >> ~/.ssh/config

      - name: Set up SSH key
        if: env.SSH_PRIVATE_KEY != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # Reaps this run's own leases regardless of age, then does the ordinary
      # age-gated sweep. Without the targeted reap a cancelled build's lease is
      # only seconds old here and looks healthy, so its VM would survive until
      # some unrelated later run happened to sweep it.
      - run: bun run cf prune --days 7 --reap-lease "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
