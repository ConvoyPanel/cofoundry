name: Release coport

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate semver tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not semver. Expected v1.2.3, 1.2.3, v1.2.3-rc.1, etc."
            exit 1
          fi

      - name: Validate coport/package.json version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r '.version' coport/package.json)
          if [[ "$TAG" != "$PKG" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match coport/package.json version '$PKG'."
            echo "Bump coport/package.json to '$TAG' (and add a matching CHANGELOG entry) before tagging."
            exit 1
          fi
          echo "Tag and coport/package.json agree on version $PKG."

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install coport dependencies
        run: bun install --frozen-lockfile
        working-directory: coport

      - name: Typecheck
        run: bun run typecheck
        working-directory: coport

      - name: Build Linux binaries
        run: |
          mkdir -p ../release
          # Use the baseline x64 target (no AVX2) so the binary runs on pre-Haswell
          # Proxmox nodes (e.g. Ivy Bridge Xeon E5 v2) instead of crashing with
          # "Illegal instruction". coport is I/O-bound, so the baseline ISA costs nothing.
          bun build --compile --target=bun-linux-x64-baseline --outfile ../release/coport-linux-x64 src/main.ts
          bun build --compile --target=bun-linux-arm64 --outfile ../release/coport-linux-arm64 src/main.ts
        working-directory: coport

      - name: Package artifacts
        run: |
          # Bare file names, so `sha256sum -c` works next to a downloaded binary.
          (cd release && sha256sum coport-linux-x64 coport-linux-arm64 > coport.sha256)

      - name: Extract release notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Headings follow Keep a Changelog: "## [1.2.3] - 2026-06-28".
          # Stop at the next version heading or the link-reference footer.
          awk -v tag="$TAG" '
            $0 ~ "^##[[:space:]]+\\[v?" tag "\\]" { found = 1; next }
            found && (/^##[[:space:]]/ || /^\[[^]]+\]:[[:space:]]/) { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coport-linux
          path: release/
          if-no-files-found: error

      - name: Publish GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: release/coport-linux-x64,release/coport-linux-arm64,release/coport.sha256
          bodyFile: release-notes.md
          draft: true
          name: ${{ github.ref_name }}
          replacesArtifacts: true
          tag: ${{ github.ref_name }}
          updateOnlyUnreleased: true
