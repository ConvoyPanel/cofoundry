#version=RHEL9
repo --name="AppStream" --baseurl=https://dl.rockylinux.org/pub/rocky/9/AppStream/x86_64/os/
url --url="https://dl.rockylinux.org/pub/rocky/9/BaseOS/x86_64/os/"
text
firstboot --disabled
ignoredisk --only-use=sda
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8

network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=localhost.localdomain

# No usable root password in the image: cloud-init sets the clone's. A
# plaintext placeholder here used to ship as a hash one `passwd -u` away
# from a published password.
rootpw --lock --iscrypted *
user --name=packer --groups=wheel --lock --shell=/bin/bash
sshkey --username=packer "__PACKER_SSH_PUBLIC_KEY__"

# As the official GenericCloud images: SELinux enforcing, no firewalld.
selinux --enforcing
firewall --disabled
services --enabled="NetworkManager,sshd,chronyd,qemu-guest-agent,cloud-init,cloud-init-local,cloud-config,cloud-final"
timezone Etc/UTC --utc
bootloader --timeout=1 --append="console=tty0 console=ttyS0,115200"

# GPT with a BIOS boot partition: an MBR caps growpart at 2 TiB.
clearpart --all --initlabel --disklabel=gpt --drives=sda
part biosboot --fstype="biosboot" --size=1 --ondisk=sda
part / --fstype="xfs" --grow --size=1024

skipx
reboot

# Excluded and added as in the official GenericCloud kickstarts: no weak
# dependencies, no bare-metal firmware, an initramfs with every storage
# driver rather than only the build VM's, no rescue kernel.
%packages --exclude-weakdeps --inst-langs=en
@^minimal-environment
openssh-server
openssh-clients
qemu-guest-agent
sudo
chrony
cloud-init
cloud-utils-growpart
curl
wget
python3
tar
rsync
dracut-config-generic
-dracut-config-rescue
-firewalld
-*firmware
%end

%addon com_redhat_kdump --disable
%end

%post --log=/root/ks-post.log
echo '%wheel ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/wheel
chmod 440 /etc/sudoers.d/wheel
systemctl enable qemu-guest-agent
mkdir -p /etc/ssh/sshd_config.d
printf 'PermitRootLogin yes
PasswordAuthentication yes
' > /etc/ssh/sshd_config.d/10-cofoundry.conf
systemctl enable cloud-init-local
systemctl enable cloud-init
systemctl enable cloud-config
systemctl enable cloud-final
# Files written above must carry their policy labels: the image enforces.
restorecon -R /etc/ssh /etc/sudoers.d /home
%end
