#version=RHEL8
repo --name="AppStream" --baseurl=https://dl.rockylinux.org/pub/rocky/8/AppStream/x86_64/os/
url --url="https://dl.rockylinux.org/pub/rocky/8/BaseOS/x86_64/os/"
text
firstboot --disabled
ignoredisk --only-use=sda
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8

network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=localhost.localdomain

# No usable root password in the image: cloud-init sets the clone's. A
# plaintext placeholder here used to ship as a hash one `passwd -u` away
# from a published password.
rootpw --lock --iscrypted *
user --name=packer --groups=wheel --lock --shell=/bin/bash
sshkey --username=packer "__PACKER_SSH_PUBLIC_KEY__"

# As the official GenericCloud images: SELinux enforcing, no firewalld. el8's
# anaconda installs firewalld for any `firewall` command, even --disabled, and
# fails the install if %packages excludes it; finalize.sh removes it instead.
selinux --enforcing
firewall --disabled
services --enabled="NetworkManager,sshd,chronyd,qemu-guest-agent,cloud-init,cloud-init-local,cloud-config,cloud-final"
timezone Etc/UTC --utc
bootloader --timeout=1 --append="console=tty0 console=ttyS0,115200"

# The official GenericCloud layout, which boots under BIOS and UEFI: GPT (an
# MBR caps growpart at 2 TiB), a BIOS boot partition, a FAT32 EFI system
# partition, and the root last, so growpart can extend it. anaconda creates
# the `efi` format only on a UEFI machine and this installer runs under
# SeaBIOS, so the ESP is plain vfat here; the %post below gives it the ESP
# type and mounts it as anaconda would mount an ESP.
clearpart --all --initlabel --disklabel=gpt --drives=sda
part biosboot --fstype="biosboot" --size=1 --ondisk=sda
part /boot/efi --fstype="vfat" --size=200 --ondisk=sda --fsoptions="umask=0077,shortname=winnt" --mkfsoptions="-F 32"
part / --fstype="xfs" --grow --size=1024

skipx
reboot

# Excluded and added as in the official GenericCloud kickstarts: no weak
# dependencies, an initramfs with every storage driver rather than only the
# build VM's, no rescue kernel. el8's kernel-core requires linux-firmware, so
# only the optional Wi-Fi firmware can go; excluding linux-firmware leaves the
# package set unsolvable and anaconda waiting at "Press ENTER".
# el8's kickstart parser knows only the camelCase spellings; it rejects
# --exclude-weakdeps and the installer stops at that parse error.
%packages --excludeWeakdeps --instLangs=en
@^minimal-environment
openssh-server
openssh-clients
qemu-guest-agent
sudo
chrony
cloud-init
cloud-utils-growpart
curl
wget
python3
tar
rsync
dracut-config-generic
# UEFI boot, beside the grub2-pc anaconda installs for BIOS: shim and the
# signed GRUB land in the ESP straight from the packages.
grub2-efi-x64
shim-x64
dosfstools
-dracut-config-rescue
-iwl*-firmware
%end

%addon com_redhat_kdump --disable
%end

%post --log=/root/ks-post.log
echo '%wheel ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/wheel
chmod 440 /etc/sudoers.d/wheel
systemctl enable qemu-guest-agent
# el8's sshd_config has no Include, so a drop-in would never be read. Its
# defaults are already PermitRootLogin yes and PasswordAuthentication yes;
# finalize.sh checks the effective values with sshd -T.
systemctl enable cloud-init-local
systemctl enable cloud-init
systemctl enable cloud-config
systemctl enable cloud-final
# Files written above must carry their policy labels: the image enforces.
restorecon -R /etc/ssh /etc/sudoers.d /home
%end

# Boot under UEFI as well as BIOS, as the official GenericCloud images do.
# They are built under UEFI and add BIOS GRUB in %post; this installer runs
# under SeaBIOS, so this does the reverse:
#   - gives the vfat /boot/efi the EFI system partition type;
#   - keeps the GRUB environment in /boot/grub2. el8's grub2-efi-x64 makes
#     /boot/grub2/grubenv a symlink into the ESP, which BIOS GRUB cannot
#     follow, and that file carries el8's kernel command line (kernelopts);
#   - writes the stub grub.cfg the UEFI GRUB reads, which hands over to
#     /boot/grub2/grub.cfg, so both firmwares boot from one config that
#     grub2-mkconfig keeps current. el9 and later generate the stub with
#     their own gen_grub_cfgstub; el8 has none, so it is written the same way.
# shim-x64 puts shim and its fallback loader at the removable path,
# EFI/BOOT/BOOTX64.EFI, which is what a clone's new variable store boots.
# Failures here do not stop the install; finalize.sh checks every one of these
# and fails the build with the reason.
%post --log=/root/ks-post-efi.log
set -x
esp=$(findmnt -n -o SOURCE /boot/efi)
part=${esp#/dev/}
sfdisk --part-type "/dev/${part%%[0-9]*}" "${part##*[!0-9]}" C12A7328-F81F-11D2-BA4B-00A0C93EC93B
efidir=$(dirname "$(rpm -ql grub2-efi-x64 | grep '/grubx64\.efi$')")
if [ -L /boot/grub2/grubenv ]; then
  env=$(readlink -f /boot/grub2/grubenv)
  rm -f /boot/grub2/grubenv
  cp "$env" /boot/grub2/grubenv
  rm -f "$env"
  restorecon /boot/grub2/grubenv
fi
if command -v gen_grub_cfgstub >/dev/null; then
  gen_grub_cfgstub /boot/grub2 "$efidir"
else
  printf '%s\n' \
    "search --no-floppy --fs-uuid --set=dev $(grub2-probe --target=fs_uuid /boot/grub2)" \
    "set prefix=(\$dev)$(grub2-mkrelpath /boot/grub2)" \
    'export $prefix' \
    'configfile $prefix/grub.cfg' >"$efidir/grub.cfg"
fi
%end
